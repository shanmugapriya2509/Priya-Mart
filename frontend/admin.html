
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriyaMart | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #fff8dc;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .admin-container {
            max-width: 950px;
            margin: 45px auto;
            padding: 25px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .admin-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-top: 25px;
            box-shadow: 0 4px 15px #00000012;
        }

        .seller-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        button {
            background: #ffbf00;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <main class="admin-container">
        <div class="admin-header">
            <h1>PriyaMart Admin Dashboard</h1>
            <button onclick="logout()">Logout</button>
        </div>

        <div class="admin-card">
            <h2>Pending Seller Approvals</h2>
            <div id="message"></div>
            <div id="sellerList">Loading sellers...</div>
        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>
