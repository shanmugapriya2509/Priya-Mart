<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - PriyaMart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="seller-header">
        <div>
            <h1>PriyaMart</h1>
            <span>Seller Center</span>
        </div>

        <button onclick="sellerLogout()">Logout</button>
    </header>

    <main class="seller-container">

        <div class="seller-title">
            <div>
                <p>SELLER DASHBOARD</p>
                <h2>Manage Products</h2>
            </div>

            <button class="add-product-btn" onclick="showProductForm()">
                + Add Product
            </button>
        </div>

        <section class="seller-stats">

            <div class="seller-stat-card">
                <span>Total Products</span>
                <strong id="sellerProductCount">0</strong>
            </div>

            <div class="seller-stat-card">
                <span>In Stock</span>
                <strong id="inStockCount">0</strong>
            </div>

            <div class="seller-stat-card">
                <span>Out of Stock</span>
                <strong id="outOfStockCount">0</strong>
            </div>

        </section>

        <section id="productFormSection" class="seller-product-form">

            <h3>Add New Product</h3>

            <input type="text" id="sellerProductName"
                   placeholder="Product name">

            <input type="number" id="sellerProductPrice"
                   placeholder="Price">

            <input type="text" id="sellerProductCategory"
                   placeholder="Category">

            <input type="number" id="sellerProductStock"
                   placeholder="Stock quantity">

            <textarea id="sellerProductDescription"
                      placeholder="Product description"></textarea>

            <small id="sellerProductError"></small>

            <button onclick="saveProduct()">Save Product</button>

        </section>

        <section class="seller-products">

            <div class="seller-section-heading">
                <h2>Your Products</h2>
                <span id="sellerStatus"></span>
            </div>

            <div id="sellerProductList">
                Loading products...
            </div>

        </section>

    </main>

    <script src="seller.js"></script>

</body>
</html>
